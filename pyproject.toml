[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenpilot"
version = "0.1.0"
description = "AWS cost, carbon, and EU-governance assessment engine: the open-source core behind greenpilotai.com"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Richard Schmitz" }]
urls = { Homepage = "https://greenpilotai.com", Repository = "https://github.com/flango2023/GreenPilot-AI" }

[project.optional-dependencies]
dev = ["pytest>=7"]
aws = ["boto3>=1.34"]

[project.scripts]
greenpilot = "greenpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
